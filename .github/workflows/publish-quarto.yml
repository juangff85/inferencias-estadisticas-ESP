name: Publish Quarto site

on:
  push:
    branches:
      - main
      - work
  workflow_dispatch:

# Si llegan varios commits seguidos, solo debe publicar la ejecución más reciente.
# Esto evita que dos procesos intenten actualizar gh-pages al mismo tiempo.
concurrency:
  group: publish-quarto-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render HTML
        run: quarto render --to html

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Render capítulo 14

on:
  push:
    paths:
      - '14-reproducibilidad-computacional.md'
      - 'include/book-14.bib'
      - '.github/workflows/render-capitulo-14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.33

      - name: Render and capture log
        shell: bash
        run: |
          set +e
          quarto render > render-cap14.log 2>&1
          status=$?
          cat render-cap14.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs render-cap14.log
          if ! git diff --cached --quiet; then
            if [ "$status" -eq 0 ]; then
              git commit -m "Renderiza el capítulo 14 traducido"
            else
              git commit -m "Registra error de renderizado del capítulo 14"
            fi
            git push origin main
          fi
          exit $status

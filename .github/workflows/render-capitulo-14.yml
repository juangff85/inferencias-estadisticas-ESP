name: Render capítulo 14

on:
  push:
    paths:
      - '14-reproducibilidad-computacional.md'
      - 'include/book-14.bib'
      - '.github/workflows/render-capitulo-14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.33

      - name: Render site
        run: quarto render

      - name: Commit rendered site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Renderiza el capítulo 14 traducido"
            git push origin main
          fi

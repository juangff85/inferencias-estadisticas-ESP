name: Render capítulo 13

on:
  push:
    paths:
      - '13-prerregistro-y-transparencia.md'
      - 'include/book-13.bib'
      - '.github/workflows/render-capitulo-13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.33

      - name: Ajustar estructura del ejercicio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('13-prerregistro-y-transparencia.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '### 1.1 Describe la población de la que extraes la muestra': '**1.1 Describe la población de la que extraes la muestra**',
              '### 1.2 ¿Puedes recoger datos de toda la población?': '**1.2 ¿Puedes recoger datos de toda la población?**',
              '### 2. ¿Qué tamaños del efecto son de interés?': '**2. ¿Qué tamaños del efecto son de interés?**',
              '### 3. Objetivo inferencial': '**3. Objetivo inferencial**',
              '### 4. Valor informativo del estudio': '**4. Valor informativo del estudio**',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Render site
        run: quarto render

      - name: Commit rendered site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 13-prerregistro-y-transparencia.md docs
          if ! git diff --cached --quiet; then
            git commit -m "Corrige la estructura y renderiza el capítulo 13"
            git push origin main
          fi

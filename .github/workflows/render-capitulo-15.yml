name: Render capítulo 15

on:
  push:
    paths:
      - '15-integridad-de-la-investigacion.md'
      - '.github/workflows/render-capitulo-15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.33

      - name: Recuperar bibliografía original
        run: curl -L --fail https://raw.githubusercontent.com/Lakens/statistical_inferences/master/include/book.bib -o include/book-15.bib

      - name: Render site
        run: quarto render

      - name: Commit rendered site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/book-15.bib docs
          if ! git diff --cached --quiet; then
            git commit -m "Renderiza el capítulo 15 traducido"
            git push origin main
          fi
